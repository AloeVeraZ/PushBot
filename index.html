<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101411">
<title>PushBot · Driver station</title>
<style>
:root{color-scheme:dark;--bg:#101411;--panel:#1a201b;--line:#354237;--muted:#a4b2a5;--lime:#c2f46e;--red:#ff837b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f5ed;font:16px system-ui,sans-serif;overscroll-behavior:none}main{max-width:900px;margin:auto;padding:22px 20px max(20px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:29px;letter-spacing:-1px;margin:0}.eyebrow{color:var(--lime);font:11px ui-monospace,monospace;letter-spacing:2px;margin:0 0 7px}.badge{border:1px solid var(--line);border-radius:30px;padding:8px 12px;font:12px ui-monospace,monospace;color:var(--muted)}.badge.live{color:var(--lime);border-color:#6d8d3c}.topline{display:flex;justify-content:space-between;align-items:center;margin:24px 0 14px;gap:12px}#state{font-size:15px;font-weight:650}#detail{font-size:12px;color:var(--muted);margin-top:5px}.toggle{border:0;border-radius:10px;padding:13px 20px;font-weight:750;font-size:14px;background:var(--lime);color:#17210e}.toggle:disabled{opacity:.4}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px}.side{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px}.sidehead{display:flex;justify-content:space-between;font-size:12px;font-weight:650;letter-spacing:1px}.readout{color:var(--lime);font-family:ui-monospace,monospace}.pad{height:clamp(200px,38vh,330px);position:relative;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;cursor:ns-resize;margin-top:12px;border-radius:10px;background:linear-gradient(90deg,transparent 49.5%,#354237 49.5%,#354237 50.5%,transparent 50.5%)}.pad:focus-visible{outline:2px solid var(--lime)}.pad::before{content:'';position:absolute;top:50%;left:10%;right:10%;border-top:1px dashed #53604e}.direction{position:absolute;left:0;right:0;text-align:center;color:#869582;font:10px ui-monospace,monospace;letter-spacing:1px}.forward{top:6px}.reverse{bottom:6px}.thumb{position:absolute;left:calc(50% - 34px);top:calc(50% - 22px);width:68px;height:44px;background:#3f4d38;border:1px solid #7b9068;border-radius:11px;display:grid;place-items:center;color:#bdccaa;pointer-events:none;font-size:22px}.enabled .thumb{background:var(--lime);border-color:var(--lime);color:#26321b}.hint{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 22px}.speedrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px}input[type=range]{width:100%;accent-color:var(--lime);height:28px}#stop{width:100%;border:1px solid #b44f49;background:#49221f;color:#ffb6af;border-radius:12px;padding:18px;font:750 17px system-ui;letter-spacing:1px;margin-top:16px;touch-action:manipulation}#stop:active{background:#803830}.footer{display:flex;justify-content:space-between;color:#82917e;font:11px ui-monospace,monospace;gap:12px;margin-top:20px}button{cursor:pointer}button:focus-visible{outline:2px solid white;outline-offset:3px}@media(max-height:550px) and (orientation:landscape){main{max-width:820px;padding-top:10px}.pad{height:160px}.topline{margin:10px 0}.hint{margin:8px}header h1{font-size:23px}.eyebrow{display:none}.footer{margin-top:10px}#stop{padding:10px;margin-top:6px}}
</style>
</head>
<body>
<main>
<header><div><p class="eyebrow">BACK OFF THE FLOOR / 01</p><h1>PushBot<span style="color:var(--lime)">.</span></h1></div><span class="badge" id="link">CONNECTING</span></header>
<section class="topline"><div><div id="state" role="status" aria-live="polite">Robot disabled</div><div id="detail">Connecting to your robot…</div></div><button id="enable" class="toggle" disabled>Enable drive</button></section>
<section class="controls" aria-label="Tank controls">
<div class="side"><div class="sidehead">LEFT TRACK <span class="readout" id="leftValue">0%</span></div><div class="pad" id="leftPad" role="slider" tabindex="0" aria-label="Left track, hold and slide; arrow keys also work" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><span class="direction forward">FORWARD ↑</span><div class="thumb" id="leftThumb">═</div><span class="direction reverse">REVERSE ↓</span></div></div>
<div class="side"><div class="sidehead">RIGHT TRACK <span class="readout" id="rightValue">0%</span></div><div class="pad" id="rightPad" role="slider" tabindex="0" aria-label="Right track, hold and slide; arrow keys also work" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><span class="direction forward">FORWARD ↑</span><div class="thumb" id="rightThumb">═</div><span class="direction reverse">REVERSE ↓</span></div></div>
</section>
<p class="hint">Hold + slide to drive. Release to stop that track.</p>
<div class="speedrow"><label for="speed">Speed limit</label><output id="speedValue" for="speed">35%</output></div>
<input id="speed" type="range" min="10" max="100" step="5" value="35">
<button id="stop">STOP &amp; DISABLE</button>
<div class="footer"><span id="output">OUTPUT L 0 / R 0</span><span id="uptime">ROBOT —</span></div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
let socket, session=0, sequence=0, armSequence=0, requested=false, armed=false;
let lastState=0, ready=false, reconnectTimer, busy=false;
const values={left:0,right:0}, pointers={left:null,right:null};
const speed=()=>Number($('speed').value)/100;
function setTrack(side,value){
  values[side]=value;
  const percentage=Math.round(value*speed());
  $(side+'Value').textContent=percentage+'%';
  $(side+'Pad').setAttribute('aria-valuenow',percentage);
  $(side+'Thumb').style.top='calc('+(50-value*.38)+'% - 22px)';
}
function neutral(){ for(const side of ['left','right']){pointers[side]=null;setTrack(side,0);} }
function render(){
  document.body.classList.toggle('enabled',armed);
  $('enable').disabled=!ready;
  $('enable').textContent=requested?'Disable drive':'Enable drive';
  $('state').textContent=armed?'Drive enabled':requested?'Enabling…':'Robot disabled';
}
function send(command,left=0,right=0){
  if(!socket || socket.readyState!==WebSocket.OPEN || !session) return 0;
  if(socket.bufferedAmount>256){disable('Connection delayed. Reconnect before driving.',false);socket.close();return 0;}
  const seq=++sequence;
  socket.send([command,session,seq,left,right].join(','));
  return seq;
}
function disable(reason,notify=true){
  requested=armed=false;neutral();render();
  if(reason) $('detail').textContent=reason;
  if(notify) send('S');
}
function connect(){
  clearTimeout(reconnectTimer);ready=false;session=0;sequence=0;busy=false;
  disable('Connecting to your robot…',false);
  $('link').textContent='CONNECTING';$('link').classList.remove('live');
  socket=new WebSocket('ws://'+location.hostname+':81/');
  socket.onmessage=event=>{
    let message;try{message=JSON.parse(event.data);}catch{return;}
    if(message.type==='busy'){busy=true;disable('Another driver station is open. Close it first.',false);return;}
    if(message.type==='hello'){session=message.session;lastState=performance.now();return;}
    if(message.type!=='state'||!session) return;
    lastState=performance.now();ready=true;
    $('link').textContent='CONNECTED';$('link').classList.add('live');
    if(requested && message.ack>=armSequence){
      if(message.armed) armed=true;
      else disable('Drive disabled. Release controls, then enable again.',false);
    }
    if(!requested) $('detail').textContent='Ready when you are. Enable to drive.';
    else if(armed) $('detail').textContent='You have control. Release either track to stop it.';
    $('output').textContent='OUTPUT L '+message.left+' / R '+message.right;
    $('uptime').textContent='ROBOT '+Math.floor(message.uptime/60)+':'+String(message.uptime%60).padStart(2,'0');
    render();
  };
  socket.onclose=()=>{
    ready=false;session=0;disable(busy?'Another driver station is open. Close it first.':'Connection lost. Robot watchdog stops drive.',false);
    $('link').textContent=busy?'IN USE':'OFFLINE';$('link').classList.remove('live');
    $('output').textContent='OUTPUT —';
    reconnectTimer=setTimeout(connect,2000);
  };
  socket.onerror=()=>socket.close();
}
$('enable').addEventListener('click',()=>{
  if(requested){disable('Drive disabled.');return;}
  if(!ready) return;
  neutral();requested=true;armed=false;
  armSequence=send('A');
  if(!armSequence) requested=false;
  render();
});
$('stop').addEventListener('pointerdown',()=>disable('Stopped. Enable again when ready.'));
$('stop').addEventListener('click',()=>disable('Stopped. Enable again when ready.'));
$('speed').addEventListener('input',()=>{
  $('speedValue').textContent=$('speed').value+'%';
  for(const side of ['left','right']) setTrack(side,values[side]);
});
for(const side of ['left','right']){
  const pad=$(side+'Pad');
  const move=event=>{
    const box=pad.getBoundingClientRect();
    let value=Math.max(-100,Math.min(100,(box.top+box.height/2-event.clientY)/(box.height*.38)*100));
    if(Math.abs(value)<7)value=0;
    setTrack(side,value);
  };
  pad.addEventListener('pointerdown',event=>{
    if(!armed||pointers[side]!==null||(event.pointerType==='mouse'&&event.button!==0)) return;
    event.preventDefault();pointers[side]=event.pointerId;pad.setPointerCapture(event.pointerId);move(event);
  });
  pad.addEventListener('pointermove',event=>{if(armed&&pointers[side]===event.pointerId)move(event);});
  const release=event=>{if(pointers[side]===event.pointerId){pointers[side]=null;setTrack(side,0);if(armed)sendDrive();}};
  for(const name of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(name,release);
  pad.addEventListener('keydown',event=>{if(armed&&['ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();setTrack(side,event.key==='ArrowUp'?100:-100);}});
  pad.addEventListener('keyup',event=>{if(['ArrowUp','ArrowDown'].includes(event.key)){setTrack(side,0);if(armed)sendDrive();}});
  pad.addEventListener('blur',()=>{setTrack(side,0);if(armed)sendDrive();});
}
function sendDrive(){send('D',Math.round(values.left*speed()),Math.round(values.right*speed()));}
setInterval(()=>{
  if(session && performance.now()-lastState>500){ready=false;disable('Robot stopped responding. Reconnecting…');socket.close();return;}
  if(armed)sendDrive();
},100);
window.addEventListener('blur',()=>disable('Window inactive. Drive disabled.'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)disable('Driver station hidden. Drive disabled.');});
window.addEventListener('pagehide',()=>{disable('',true);if(socket)socket.close();});
window.addEventListener('keydown',event=>{if(event.code==='Space'&&event.target.tagName!=='BUTTON'){event.preventDefault();disable('Stopped.');}});
connect();
</script>
</body>
</html>
